x-app-env: &app-env
  APP_NAME: ${APP_NAME:-HR}
  APP_ENV: production
  APP_DEBUG: "false"
  APP_KEY: ${APP_KEY:?APP_KEY is required}
  APP_URL: ${APP_URL:?APP_URL is required}
  # The messages are Arabic (D-005), fixed here: lang/en lacks the documents', reports' and imports' messages (they
  # would show as keys), and a .env copied from .env.example beside this file would otherwise bring back "en".
  APP_LOCALE: ar
  APP_FALLBACK_LOCALE: ar
  # The identity fingerprint key (D-038): keep it with the backups, never rotate it casually.
  HR_IDENTITY_HASH_KEY: ${HR_IDENTITY_HASH_KEY:?HR_IDENTITY_HASH_KEY is required}
  HR_TIMEZONE: ${HR_TIMEZONE:-Asia/Damascus}
  LOG_CHANNEL: stack
  LOG_STACK: daily
  LOG_DAILY_DAYS: "0"
  LOG_LEVEL: ${LOG_LEVEL:-warning}
  DB_CONNECTION: pgsql
  DB_HOST: db
  DB_PORT: "5432"
  DB_DATABASE: ${DB_DATABASE:-hr}
  DB_USERNAME: ${DB_USERNAME:-hr}
  DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
  SESSION_DRIVER: file
  CACHE_STORE: database
  # Nothing is queued (an import is written after its response, D-053), so there is no worker to run.
  QUEUE_CONNECTION: ${QUEUE_CONNECTION:-sync}
  # The reverse proxy in front (D-054): its addresses, or "*" only when port 8082 is reachable by the proxy alone.
  TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
  MAIL_MAILER: ${MAIL_MAILER:-log}
  PHP_OPCACHE_ENABLE: "1"

services:
  app:
    build: .
    restart: unless-stopped
    environment:
      <<: *app-env
      # Runs migrate --force, storage:link and optimize on every start (web container only).
      AUTORUN_ENABLED: "true"
      # migrate --force --seed: the roles, permissions, lists and field guide (re-run safe, no users; section 7.8).
      AUTORUN_LARAVEL_MIGRATION_SEED: "true"
      HEALTHCHECK_PATH: /up
    ports:
      - "8082:8080"
    volumes:
      - storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-hr}
      POSTGRES_USER: ${DB_USERNAME:-hr}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  storage:
  pgdata:
